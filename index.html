<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K리그 취향표</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1f5c;--deep:#06143d;--sky:#a9c8ff;--paper:#f2f5ff;--line:#2a4290}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--deep);padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:14px;color:var(--navy)}
.plus{width:42px;height:42px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:26px;line-height:1;cursor:pointer}
#scroll{overflow-x:auto;border-radius:18px;background:#fff;border:1.5px solid #d5def5}
#sheet{width:max-content;min-width:100%;background:#fff;padding:22px 14px 18px;color:var(--navy)}
.head{position:sticky;left:0;width:calc(100vw - 52px);text-align:center;margin-bottom:12px}
h1{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;font-size:36px;letter-spacing:1px;margin:0}
.sub{color:#5b6fa8;font-size:13px;margin:4px 0 0}
table{border-collapse:separate;border-spacing:6px}
th{font-weight:400;vertical-align:bottom;padding:0 0 2px}
.ch{min-width:72px;text-align:center}
.club{display:block;font-size:11px;color:#5b6fa8;margin-top:3px;white-space:nowrap}
.badge{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px 'Noto Sans KR';color:#fff;border:2px solid #fff;background-size:cover;background-position:center}
.badge.big{width:42px;height:42px}
.badge.kl{position:relative;overflow:hidden;background:#fff;border-radius:6px;width:44px;height:44px;color:#0a1f5c;border:1.5px solid #d5def5}
.badge.sq{position:relative;overflow:hidden;background:#fff;border-radius:6px;font-size:11px;border:1.5px solid #d5def5}
.badge.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:2px}
.badge.kl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.name{position:sticky;left:0;z-index:2;background:#eef2fd;border-radius:10px;min-width:92px;padding:4px;box-shadow:6px 0 6px -2px rgba(10,31,92,.14)}
.name input{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--navy);color:var(--navy);font:700 14px 'Noto Sans KR';padding:4px 2px;text-align:center}
.name input::placeholder{color:#8c9bc8}
.x{display:block;margin:2px auto 0;background:none;border:0;color:#5b6fa8;font-size:11px;cursor:pointer;padding:2px 6px}
.cell{width:72px;min-height:70px;background:#f4f7ff;border:1.5px solid #c9d5f2;border-radius:12px;padding:6px 2px;color:var(--navy);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cell.has{background:#e6edff;border-color:var(--navy)}
.cell:focus-visible,.chip:focus-visible,.btn:focus-visible,.plus:focus-visible,.x:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.pick{font-weight:700;font-size:11px;line-height:1.15;word-break:keep-all;text-align:center}
.pl{font-size:22px;color:#8c9bc8;line-height:1}
.cap .name{position:static;box-shadow:none}
.cap .head{position:static;width:auto}
.cap .x{display:none}
.foot{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:13px;border-radius:12px;border:2px solid var(--navy);background:#fff;color:var(--navy);font:700 15px 'Noto Sans KR';cursor:pointer}
.btn.main{background:var(--navy);color:#fff}
.layer{position:fixed;inset:0;background:rgba(6,20,61,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
.layer.on{display:flex}
.panel{background:var(--paper);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 10px;font-size:17px}
.pos{font-size:12px;font-weight:700;color:var(--navy);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--navy);background:#fff;color:var(--deep);border-radius:999px;padding:7px 12px;font:400 14px 'Noto Sans KR';cursor:pointer}
.chip.sel{background:var(--navy);color:#fff}
.chip.none{border-style:dashed}
.own{display:flex;gap:6px;margin-top:14px}
.own input{flex:1;border:1.5px solid var(--navy);border-radius:10px;padding:9px;font:400 14px 'Noto Sans KR'}
.empty{font-size:13px;color:#5b6a9a;margin:6px 0}
.res{text-align:center}
.res img{width:100%;border-radius:12px}
.res p{font-size:13px;margin:8px 0}
.res a.btn{display:block;margin:8px 0 14px;text-decoration:none}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>
<div class="bar"><span id="cnt"></span><button class="plus" id="add" aria-label="프로필 추가">+</button></div>
<div id="scroll">
  <div id="sheet">
    <div class="head"><h1>K리그 취향표</h1><p class="sub">♥당신의취향을뽑아보세요..♥</p></div>
    <table id="tbl"></table>
  </div>
</div>
<div class="foot">
  <button class="btn" id="reset">전체 초기화</button>
  <button class="btn main" id="save">이미지로 저장</button>
</div>

<div class="layer" id="pickL"><div class="panel" role="dialog" aria-modal="true" id="pickP"></div></div>
<div class="layer" id="resL"><div class="panel res" id="resP"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  DF:'박규현,김민덕,조성권,임종은,강윤성,김진야,이명재,오재석,서영재,이정택,김문환,임유석,하창래,안톤',
  MF:'밥신,엄원상,김준범,루빅손,이현식,김봉수,박병찬,이순민,김현욱',

  DF:'김종민,패트릭,티아깅요,김규민,홍성욱,안태현,백동규,이예찬,유승현,신재원,조성준,이재원',

const PHOTO={};
// ─────────────────────────────────────────────────────────────
const EMPTY='__empty';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={rows:[{name:'',picks:{}}]};
try{const d=JSON.parse(localStorage.getItem('kprofiles2')||'null'); if(d&&d.rows&&d.rows.length) S=d}catch(e){}
const save=()=>{try{localStorage.setItem('kprofiles2',JSON.stringify(S))}catch(e){}};
// K리그 로고: 같은 폴더에 kleague.png 파일을 올리면 자동으로 표시돼요. 없으면 남색 'K' 원으로 보여요.
const KLOGO='kleague.png';
const klogo=()=>`<span class="badge kl"><img src="${KLOGO}" alt="K리그" onerror="this.remove()">K</span>`;
// 구단 엠블럼: emblems 폴더에 구단id.png (예: emblems/seoul.png)를 올리면 자동으로 표시돼요. 없으면 흰 배경에 구단 약칭이 보여요.
const badge=(c,big,photo)=>photo
  ?`<span class="badge sq${big?' big':''}" style="background-image:url('${esc(photo)}');background-size:cover"></span>`
  :`<span class="badge sq${big?' big':''}" style="color:${c.c}"><img src="emblems/${c.id}.png" alt="" onerror="this.remove()">${c.s}</span>`;

function render(){
  $('cnt').textContent=S.rows.length>1?`프로필 ${S.rows.length}명`:'혼자 만들기';
  let h='<tr><th class="name" style="background:none;box-shadow:none"></th>'+CLUBS.map(c=>`<th class="ch">${badge(c,true)}<span class="club">${c.name}</span></th>`).join('')+'</tr>';
  S.rows.forEach((row,r)=>{
    h+=`<tr><td class="name"><input data-r="${r}" maxlength="10" value="${esc(row.name)}" placeholder="${r?'이름':'내 이름'}" aria-label="프로필 이름">${r?`<button class="x" data-del="${r}" aria-label="프로필 삭제">삭제</button>`:''}</td>`;
    h+=CLUBS.map(c=>{
      const p=row.picks[c.id]; let b;
      if(p===EMPTY) b=`${klogo()}<span class="pick">텅</span>`;
      else if(p) b=`${badge(c,false,PHOTO[p])}<span class="pick">${esc(p)}</span>`;
      else b='<span class="pl">+</span>';
      return `<td><button class="cell${p?' has':''}" data-r="${r}" data-id="${c.id}" aria-label="${c.name} 선수 고르기">${b}</button></td>`;
    }).join('')+'</tr>';
  });
  $('tbl').innerHTML=h;
}

function openPick(r,id){
  const c=CLUBS.find(x=>x.id===id), ro=R[id], cur=S.rows[r].picks[id];
  let h=`<h2>${esc(S.rows[r].name||'내')} · ${c.name}</h2>`;
  if(ro) for(const pos in ro) h+=`<div class="pos">${pos}</div><div class="chips">${ro[pos].split(',').map(n=>`<button class="chip${cur===n?' sel':''}" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
  else h+='<p class="empty">선수 명단 준비 중이에요. 아래에 직접 입력할 수 있어요.</p>';
  h+=`<div class="pos">선수 없이</div><div class="chips"><button class="chip none${cur===EMPTY?' sel':''}" data-n="${EMPTY}">K리그 로고 고르기 (텅)</button>${cur?'<button class="chip none" data-n="">선택 취소</button>':''}</div>`;
  h+='<div class="own"><input id="own" maxlength="12" placeholder="직접 입력"><button class="btn main" id="ownOk" style="flex:0 0 auto;padding:9px 16px">확인</button></div>';
  $('pickP').innerHTML=h; $('pickP').dataset.r=r; $('pickP').dataset.id=id; $('pickL').classList.add('on');
}
const closeAll=()=>document.querySelectorAll('.layer').forEach(l=>l.classList.remove('on'));
function setPick(v){
  const {r,id}=$('pickP').dataset, pk=S.rows[+r].picks;
  if(v) pk[id]=v; else delete pk[id];
  save(); render(); closeAll();
}

$('tbl').addEventListener('click',e=>{
  const b=e.target.closest('.cell'); if(b) return openPick(+b.dataset.r,b.dataset.id);
  const d=e.target.closest('.x');
  if(d){const r=+d.dataset.del; if(confirm((S.rows[r].name||'이 프로필')+'을(를) 삭제할까요?')){S.rows.splice(r,1);save();render()}}
});
$('tbl').addEventListener('input',e=>{if(e.target.dataset.r!==undefined){S.rows[+e.target.dataset.r].name=e.target.value;save()}});
$('add').onclick=()=>{S.rows.push({name:'',picks:{}});save();render();
  const i=document.querySelector(`input[data-r="${S.rows.length-1}"]`); if(i){i.scrollIntoView({block:'nearest',inline:'start'});i.focus()}};
$('pickP').addEventListener('click',e=>{
  const ch=e.target.closest('.chip'); if(ch) return setPick(ch.dataset.n);
  if(e.target.id==='ownOk'){const v=$('own').value.trim(); if(v) setPick(v)}
});
$('pickL').addEventListener('click',e=>{if(e.target===$('pickL')) closeAll()});
$('resL').addEventListener('click',e=>{if(e.target===$('resL')) closeAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeAll()});

$('reset').onclick=()=>{ if(confirm('모든 프로필의 선택을 지울까요?')){S.rows.forEach(r=>r.picks={});save();render()} };
$('save').onclick=async()=>{
  const b=$('save'); b.disabled=true; b.textContent='만드는 중…'; $('sheet').classList.add('cap');
  try{
    const cv=await html2canvas($('sheet'),{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const url=cv.toDataURL('image/png');
    $('resP').innerHTML=`<img src="${url}" alt="완성된 K리그 취향표"><p>이미지를 길게 눌러 저장하거나 아래 버튼을 눌러요.</p><a class="btn main" href="${url}" download="K리그_취향표.png">다운로드</a><button class="btn" id="resX" style="width:100%">닫기</button>`;
    $('resL').classList.add('on'); $('resX').onclick=closeAll;
  }catch(e){alert('이미지를 만들지 못했어요. 다시 눌러 주세요.')}
  $('sheet').classList.remove('cap'); b.disabled=false; b.textContent='이미지로 저장';
};
render();
</script>
</body>
</html>
